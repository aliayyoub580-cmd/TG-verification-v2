<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/App%20Icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TG Verification" />
    <link rel="apple-touch-icon" href="/App%20Icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/App%20Icon.png" />

    <title>Indufar – Product Verification</title>
    <meta name="description" content="Verify the authenticity of your Indufar product." />
    <script>
      if (window.location.hostname.includes('tg-verification-xi.vercel.app')) {
        window.location.replace('https://tg-verification-v2.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
